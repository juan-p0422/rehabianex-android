name: Android beta verification

on:
  push:
    branches:
      - codex/privacy-notice-2026-10-30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Unit tests and release compilation
        env:
          REHABIANEX_CI_UNSIGNED_RELEASE: "true"
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest
          compileDebugAndroidTestKotlin
          assembleRelease
          lintRelease
      - name: Preserve unsigned release for local private signing
        uses: actions/upload-artifact@v5
        with:
          name: rehabianex-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
