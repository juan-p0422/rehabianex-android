name: Android beta verification

on:
  push:
    branches:
      - codex/privacy-notice-2026-10-30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Unit tests and release compilation
        env:
          REHABIANEX_CI_UNSIGNED_RELEASE: "true"
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest
          compileDebugAndroidTestKotlin
          assembleRelease
          lintRelease
      - name: Preserve unsigned release for local private signing
        uses: actions/upload-artifact@v5
        with:
          name: rehabianex-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 33]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle wrapper and KVM
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Focused regression on API ${{ matrix.api-level }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew --no-daemon connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.example.rehabianex.SensitiveConsentPresentationInstrumentedTest,com.example.rehabianex.EncryptedRoomDatabaseInstrumentedTest,com.example.rehabianex.PrivacyNoticePresentationInstrumentedTest,com.example.rehabianex.Stage7ChatPresentationInstrumentedTest
